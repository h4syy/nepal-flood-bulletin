name: Fetch OPMCM data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-opmcm:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch OPMCM reports
        run: npx tsx scripts/fetch-opmcm.ts

      - name: Commit updated data
        run: |
          if git diff --quiet -- public/data/opmcm-person-reports.json; then
            echo "No OPMCM data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/opmcm-person-reports.json
          git commit -m "Update OPMCM data"
          git push
